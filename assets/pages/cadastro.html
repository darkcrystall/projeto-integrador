<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="../styles/formulario.css">
</head>
<body>
    <div class="fundo cadastro">
        <div class="cima">
            <img src="" alt="" class="logo">
            <h3>Bem-vindo</h3>
            <p>Faça o seu cadastro</p>
        </div>
        <form action="" class="formulario" id="cadastro">
            <label for="nome">Nome</label>
            <input type="text" name="nome" id="nome" placeholder="João">
            <label for="sobrenome">Sobrenome</label>
            <input type="text" name="sobrenome" id="sobrenome" placeholder="Silva">
            <label for="email">E-mail</label>
            <input type="email" name="email" id="email" placeholder="example@domain.com">
            <label for="telefone">Telefone</label>
            <input type="tel" name="telefone" id="telefone" placeholder="519000-0000">
            <label for="cpf">CPF</label>
            <input type="number" name="cpf" id="cpf" placeholder="000-000-000-00">
            <label for="senha">Senha</label>
            <input type="password" name="senha" id="senha" placeholder="6 caracteres">
            <button type="submit" class="confirmar" id="cadastrar">Cadastrar</button>
            <div class="aglomerado">
                <div class="parte1"></div>
                <p>ou</p>
                <div class="parte2"></div>
            </div>

            <div class="botoes">
                <button class="botao">Google</button>
                <button class="botao">Github</button>
            </div>
            <p>Já possui conta? <a href="">Entre aqui</a></p>
        </form>
    </div>
</body>
</html>
